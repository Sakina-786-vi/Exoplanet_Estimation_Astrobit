<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Astro: Kepler transit-detection pipeline banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1b1f4b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.6" stop-color="#ffd25e"/>
      <stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font: 800 54px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 6px; }
      .sub   { font: 400 18px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9fb3ff; }
      .tag   { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #6f7fc9; }
      .curve { fill: none; stroke: #6ee7ff; stroke-width: 3; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 5s ease-in-out infinite; }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      .twinkle.b { animation-delay: 1s; }
      .twinkle.c { animation-delay: 2s; }
      @keyframes draw { 0% { stroke-dashoffset: 1; } 70%, 100% { stroke-dashoffset: 0; } }
      @keyframes tw { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="900" height="240" rx="16" fill="url(#bg)"/>
  <g fill="#ffffff">
    <circle class="twinkle" cx="60" cy="40" r="1.6"/>
    <circle class="twinkle b" cx="170" cy="90" r="1.2"/>
    <circle class="twinkle c" cx="330" cy="30" r="1.8"/>
    <circle class="twinkle" cx="480" cy="70" r="1.2"/>
    <circle class="twinkle b" cx="640" cy="28" r="1.6"/>
    <circle class="twinkle c" cx="760" cy="85" r="1.3"/>
    <circle class="twinkle" cx="860" cy="35" r="1.7"/>
    <circle class="twinkle b" cx="95" cy="120" r="1.1"/>
  </g>
  <!-- star with a planet transiting -->
  <circle cx="790" cy="150" r="46" fill="url(#sun)"/>
  <circle cx="790" cy="150" r="26" fill="#ffd25e"/>
  <circle cx="800" cy="152" r="8" fill="#0b1026"/>
  <text class="title" x="50" y="105">ASTRO</text>
  <text class="sub" x="52" y="138">Kepler transit-detection pipeline</text>
  <!-- light curve with two transit dips (box-shaped) -->
  <path class="curve" pathLength="1" d="M50,195 H250 V218 H330 V195 H520 V218 H600 V195 H720"/>
  <text class="tag" x="52" y="232">flux over time: each dip = a possible planet passing in front of its star</text>
</svg>
